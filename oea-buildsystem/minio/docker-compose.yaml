# MinIO — S3-compatible object store used as sstate-mirror, downloads
# mirror and deploy artefact store for the oea-buildsystem pipeline.
#
# Runs on a shared docker network `oea-build` so build containers can
# reach it via the hostname `minio` (i.e. http://minio:9000). This
# network is external so it survives compose down/up cycles and lets
# other stacks join without depending on this file.
#
# One-time host prep:
#   docker network create oea-build || true
#
# Usage:
#   MINIO_ROOT_PASSWORD='your-strong-password-here' \
#       docker compose up -d
#
# Access:
#   S3 API:       http://<host>:9000            (used by build containers)
#   Web console:  http://<host>:9001            (browser login as admin)
#
# See README.md for the initial bucket + policy + service-user setup
# that must be done once after first start.

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    networks:
      - oea-build
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web console
    volumes:
      - data:/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD env var must be set (>=8 chars)}"
      # Cosmetic: the browser tab title / login banner.
      MINIO_BROWSER_REDIRECT_URL: "${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # bitbake-hashserv: cross-stack hash equivalence server. Build stacks
  # point BB_HASHSERVE at hashserv:8686 -- recipe input/output hash
  # mappings get registered centrally, so sstate-mirror lookups match
  # across stacks even when local metadata differs slightly. Without it
  # the SSTATE_MIRRORS in MinIO would rarely hit.
  #
  # Slim alpine + bitbake source cloned once into a persistent volume.
  # ~80 MB total footprint, ~5s restart after first bootstrap.
  hashserv:
    image: alpine:3
    container_name: hashserv
    hostname: hashserv
    networks:
      - oea-build
    ports:
      - "8686:8686"
    volumes:
      - hashserv-data:/data           # sqlite DB, backup-relevant
      - hashserv-bitbake:/opt/bitbake # bitbake source, cached
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache python3 sqlite git >/dev/null
        if [ ! -d /opt/bitbake/.git ]; then
          git clone --depth 1 -b ${BITBAKE_BRANCH:-master} https://git.openembedded.org/bitbake /opt/bitbake
        fi
        exec python3 /opt/bitbake/bin/bitbake-hashserv --bind 0.0.0.0:8686 --database /data/hashserv.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8686)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s   # first boot: apk add + git clone

networks:
  # Shared bridge network. Build containers must join it to reach
  # http://minio:9000. `external: true` avoids docker deleting the
  # network on `compose down` (would break other stacks that joined).
  oea-build:
    external: true

volumes:
  # Docker-managed named volume for MinIO's data (all buckets + object
  # storage + internal state). Full docker name is
  # <project>_data -- e.g. oea-buildsystem-minio_data if you deploy
  # this stack under the default project name "oea-buildsystem-minio".
  # Stored under /var/lib/docker/volumes/<full-name>/_data/ on the host.
  # BACK THIS UP -- losing it means losing the whole sstate mirror
  # and every source tarball you seeded.
  data:
  # bitbake-hashserv sqlite DB. Losing it wipes all cross-stack hash
  # equivalences -- rebuild loop will re-populate but early sstate
  # mirror hit rate drops until it does. Back up periodically.
  hashserv-data:
  # bitbake source, cloned once from https://git.openembedded.org/bitbake
  # on first container start. Cached so restart takes seconds.
  hashserv-bitbake:
