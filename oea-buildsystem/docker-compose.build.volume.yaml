# oea-buildsystem -- continuous MACHINE loop, N MACHINEs per container.
#
# Container starts, entrypoint refreshes the recipe tree, then loops
# over $MACHINES round-robin FOREVER. After each MACHINE (success or
# fail) sstate + sources are mc-mirrored to MinIO immediately, deploy
# on success. A state file on /temp records the last completed MACHINE
# so `docker compose stop` / `down` / SIGTERM cleanly finish the
# current MACHINE and the next `up` resumes from the following one.
#
# Pause: `docker compose pause` (instant freeze, memory stays) or
#        `docker compose stop` (SIGTERM to bitbake, in-flight tasks
#        finish -- typically minutes; resume at same MACHINE on next up).
# Debug: `docker compose exec oea-build bash` or
#        `ssh -p ${SSH_PORT:-2222} builder@localhost` (password: builder).
#
# For the "4 containers x 50 MACHINEs" farm pattern: deploy 4 stacks
# with different -p project names and different MACHINES subsets. All
# four share the same MinIO buckets so warm sstate flows in real time
# between them.
#
# For bind-mount instead of named volumes (browse /temp / /sstate-cache
# / /sources / /deploy from the host), use docker-compose.build.mount.yaml.
#
# Usage:
#   MACHINES="dm900 dm920" docker compose -p oea-batch-a -f docker-compose.build.volume.yaml up
#   MACHINES="dm900 dm920" docker compose -p oea-batch-a -f docker-compose.build.volume.yaml up -d
#   docker compose -p oea-batch-a -f docker-compose.build.volume.yaml logs -f
#
# Environment overrides (via .env, shell, or Komodo stack env):
#
#   Required:
#     MACHINES="dm900 dm920 ..."      space-separated list of MACHINEs
#
#   Build tuning:
#     BRANCH=6.0                      composed image tag (default: 6.0)
#     DISTRO=openatv                  distro variant  (default: openatv)
#     DISTRO_TYPE=release             release/experimental (default: release)
#     ACTION=image                    make target     (default: image)
#     SKIP_TO_MACHINE=vuduo4k         force first-cycle start point (overrides state file)
#     STACK=a                         host-unique tag for container_name / hostname
#                                     (default: a). Set 'b', 'c', ... when
#                                     running multiple batch stacks on the
#                                     same host so container names + hostnames
#                                     don't collide.
#     SSH_PORT=2323                   host port for sshd (default: 2222).
#                                     MUST also be unique across stacks on
#                                     the same host -- SSH_PORT=2223, 2224, ...
#
#   MinIO integration (all optional; omit any block to disable):
#     SSTATE_MIRROR_URL=...           read-side sstate mirror
#     SOURCES_MIRROR_URL=...          read-side sources mirror
#     MINIO_HOST=minio:9000           write-side host
#     MINIO_ACCESS_KEY=builder        service-account access key
#     MINIO_SECRET_KEY=<secret>       service-account secret key
#
# Volumes (Docker-managed, auto-created per compose project name):
#   oea_temp         TMPDIR (huge: 50-200 GB across MACHINEs)
#   oea_sstate       local sstate cache (5-50 GB)
#   oea_sources      DL_DIR / upstream tarballs (2-20 GB)
#   oea_deploy       deploy artefacts per MACHINE (1-10 GB / MACHINE)
#
# Debug post-mortem: volumes survive `compose down`, so you can bring
# up docker-compose.volume.yaml (dev variant) with the same project
# name and inspect /temp/<MACHINE>/work/... from an exec'd shell.

services:
  oea-build:
    image: ghcr.io/wxbet-org/oea-buildsystem:${BRANCH:-6.0}
    container_name: oea-builder-auto-${STACK:-a}
    hostname: oea-builder-auto-${STACK:-a}

    networks:
      # Same shared docker network as minio -- lets the container
      # reach http://minio:9000 by hostname. External: assumed
      # pre-created by the minio stack (`docker network create oea-build`).
      - oea-build

    ports:
      # sshd runs inside the container so you can debug a live loop.
      # Login as `builder` with password `builder`.
      - "${SSH_PORT:-2222}:22"

    environment:
      MACHINES: "${MACHINES:?MACHINES env var must be set, space-separated (e.g. \"dm900 dm920\")}"
      SKIP_TO_MACHINE: "${SKIP_TO_MACHINE:-}"
      DISTRO: "${DISTRO:-openatv}"
      DISTRO_TYPE: "${DISTRO_TYPE:-release}"
      BRANCH: "${BRANCH:-6.0}"
      ACTION: "${ACTION:-image}"
      SSTATE_MIRROR_URL: "${SSTATE_MIRROR_URL:-}"
      SOURCES_MIRROR_URL: "${SOURCES_MIRROR_URL:-}"
      MINIO_HOST: "${MINIO_HOST:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-truecolor}"

    volumes:
      # `temp` holds every MACHINE's BUILDDIR (conf/env/tmp). Mounted
      # directly at the openatv release dir -- not via a symlink -- so
      # bitbake's PWD stays on physical paths. A tmp/ symlink here
      # breaks libtool-native's do_compile (inline-source's funclib.sh
      # cd's a 7-up relative path that only resolves off a real cwd).
      - "temp:/home/builder/workspace/builds/${DISTRO:-openatv}/${DISTRO_TYPE:-release}"
      - "sstate:/home/builder/sstate-cache"
      - "sources:/home/builder/sources"
      - "deploy:/home/builder/deploy"

    # Host prerequisites (see oea-buildsystem-base/README.md):
    #   kernel.apparmor_restrict_unprivileged_userns=0
    #   fs.inotify.max_user_watches=524288
    security_opt:
      - apparmor=unconfined

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Long-running loop: survive host reboots. `docker compose stop`
    # sends SIGTERM -- entrypoint forwards to bitbake, which finishes
    # its in-flight tasks (minutes, not hours) and exits cleanly.
    # State file is not advanced, so next `compose up` resumes AT the
    # same MACHINE (bitbake picks up on task-stamp resume).
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30m    # bitbake shuts down after current tasks finish

networks:
  oea-build:
    external: true

volumes:
  # temp + sstate are per-project (Docker prefixes with the compose
  # project name, e.g. `oea-buildsystem-auto-openatv-1_temp`) --
  # concurrent stacks stay isolated on tmp/work (races) and sstate
  # (bitbake write fragility). Cross-stack sstate sharing happens
  # via the MinIO mirror instead.
  temp:
  sstate:
  # sources + deploy are external, shared across every oea-buildsystem
  # stack on the host. Create once with:
  #   docker volume create oea-buildsystem_sources
  #   docker volume create oea-buildsystem_deploy
  #   docker run --rm --user 0:0 \
  #       -v oea-buildsystem_sources:/x -v oea-buildsystem_deploy:/y \
  #       alpine chown -R 1000:1000 /x /y
  # sources are URL-content-addressed (safe to share, no MinIO round-
  # trip for locally-cached tarballs). deploy has per-MACHINE subdirs
  # so different stacks with disjoint MACHINE sets never collide.
  sources:
    external: true
    name: oea-buildsystem_sources
  deploy:
    external: true
    name: oea-buildsystem_deploy
