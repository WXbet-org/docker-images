# oea-buildsystem -- long-running dev container, NO auto-build.
#
# Entrypoint runs setup (make update, mirror config, symlinks, sshd)
# and then idles on `sleep infinity` instead of firing the build loop.
# The container stays up until you `compose down`, ready for you to
# exec / SSH into and drive builds by hand:
#
#   docker compose -f docker-compose.volume.yaml exec oea-build bash
#   ssh -p 2222 builder@localhost    # password: builder
#
# Then inside:
#   make MACHINE=dm900 image             # full image build
#   MACHINE=dm900 bitbake enigma2        # single-recipe rebuild
#   MACHINE=dm900 bitbake -c menuconfig virtual/kernel
#
# Use cases: iterative debug of a failing recipe, one-off single-
# package rebuild, kernel menuconfig, poking at bitbake internals.
# For batch/CI runs (start, build N MACHINEs, exit with aggregate
# result), use docker-compose.build.volume.yaml. Same image, different
# lifecycle.
#
# One MACHINE per dev stack (drives the deploy symlink). Multiple dev
# stacks can coexist -- deploy them with different `-p` project names.
#
# Volumes: same names as the batch variant. By default each compose
# project (-p) gets its own set. To attach a dev stack to a specific
# batch stack's leftover volumes for post-mortem debug, redefine the
# volumes at the bottom with `external: true` + explicit `name:`.
#
# For bind-mount instead of named volumes, use docker-compose.mount.yaml.
#
# Usage:
#   MACHINE=dm900 docker compose -f docker-compose.volume.yaml up -d
#   docker compose -f docker-compose.volume.yaml exec oea-build bash
#   docker compose -f docker-compose.volume.yaml down     # when done
#
# Environment overrides:
#
#   Required:
#     MACHINE=dm900                   single MACHINE (drives deploy symlink)
#
#   Build tuning:
#     BRANCH=6.0                      composed image tag (default: 6.0)
#     DISTRO=openatv                  (default: openatv)
#     DISTRO_TYPE=release             (default: release)
#     SSH_PORT=2323                   host port for sshd (default: 2222)
#
#   MinIO integration (optional -- dev containers rarely sync back,
#   but reading from the mirror gives you a warm sstate on cold start):
#     SSTATE_MIRROR_URL=...
#     SOURCES_MIRROR_URL=...
#     MINIO_HOST=minio:9000
#     MINIO_ACCESS_KEY=builder
#     MINIO_SECRET_KEY=<secret>

services:
  oea-build:
    image: ghcr.io/wxbet-org/oea-buildsystem:${BRANCH:-6.0}
    container_name: oea-build-dev-${MACHINE:?MACHINE env var must be set (e.g. dm900)}
    hostname: oea-build-dev-${MACHINE}

    networks:
      - oea-build

    ports:
      # sshd runs unconditionally inside the container; the entrypoint
      # regenerates host keys per container start, so clients get a
      # one-time host-key warning after `compose down/up`. Login as
      # `builder` with password `builder`.
      - "${SSH_PORT:-2222}:22"

    environment:
      # Dev stacks use MACHINE (single); entrypoint's MACHINES fallback
      # picks it up. Dev deliberately doesn't auto-run the build loop
      # (see `command: [sleep, infinity]` below).
      MACHINE: "${MACHINE}"
      DISTRO: "${DISTRO:-openatv}"
      DISTRO_TYPE: "${DISTRO_TYPE:-release}"
      BRANCH: "${BRANCH:-6.0}"
      SSTATE_MIRROR_URL: "${SSTATE_MIRROR_URL:-}"
      SOURCES_MIRROR_URL: "${SOURCES_MIRROR_URL:-}"
      MINIO_HOST: "${MINIO_HOST:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-truecolor}"

    volumes:
      - "oea_temp:/temp"
      - "oea_sstate:/sstate-cache"
      - "oea_sources:/sources"
      - "oea_deploy:/deploy"

    # Entrypoint runs its setup, then exec's this command as PID 1.
    # Container idles waiting for docker compose exec / SSH.
    command: ["sleep", "infinity"]

    security_opt:
      - apparmor=unconfined

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    restart: "no"

networks:
  oea-build:
    external: true

volumes:
  # Fresh per-project named volumes by default. To hook this dev stack
  # up to an existing batch stack's leftover volumes for post-mortem,
  # replace each entry with:
  #   oea_temp:
  #     external: true
  #     name: <batch-project>_oea_temp
  # (and analog for the others).
  oea_temp:
  oea_sstate:
  oea_sources:
  oea_deploy:
