# oea-buildsystem -- long-running dev container, NO auto-build.
#
# Same lifecycle as docker-compose.volume.yaml (entrypoint runs its
# setup, then idles on `sleep infinity` waiting for you to exec in),
# but /sstate-cache and /deploy are bind-mounted from host paths
# instead of Docker-managed named volumes. Lets you `ls tmp-glibc/...`
# from the host or point at shared farm-filesystem paths.
#
# WARNING -- UID/GID: the container runs as `builder` (uid 1000, gid 1000).
# Bind-mount targets on the host MUST be owned by uid 1000 or the
# entrypoint's symlink-and-write steps fail immediately with
# "Permission denied". One-time host fix:
#   sudo mkdir -p ${SSTATE_DIR:-/var/lib/oea-build/sstate/${MACHINE}} \
#                 ${DEPLOY_DIR:-/var/lib/oea-build/deploy}
#   sudo chown -R 1000:1000 ${SSTATE_DIR%/*} ${DEPLOY_DIR}
#
# Usage:
#   MACHINE=dm900 docker compose -f docker-compose.mount.yaml up -d
#   docker compose -f docker-compose.mount.yaml exec oea-build bash
#   ssh -p 2222 builder@localhost    # password: builder
#   docker compose -f docker-compose.mount.yaml down     # when done
#
# Inside the exec'd shell:
#   make MACHINE=dm900 image           # full image build
#   MACHINE=dm900 bitbake enigma2      # single-recipe rebuild
#
# Environment overrides (via .env, shell or Komodo stack env):
#   MACHINE=dm900              # REQUIRED
#   BRANCH=6.0                 # image tag (default: 6.0)
#   DISTRO=openatv             # distro variant (default: openatv)
#   DISTRO_TYPE=release        # (default: release)
#   SSTATE_DIR=/data/oea-sstate      # host path for sstate-cache
#                                    # (default: /var/lib/oea-build/sstate/<MACHINE>)
#   DEPLOY_DIR=/data/oea-deploy      # host path for deploy artefacts
#                                    # (default: /var/lib/oea-build/deploy)
#   SSTATE_MIRROR_URL=...      # e.g. http://minio:9000/sstate-openatv-6.0
#   DL_MIRROR_URL=...          # e.g. http://minio:9000/downloads
#   SSH_PORT=2323              # host port for sshd    (default: 2222)

services:
  oea-build:
    image: ghcr.io/wxbet-org/oea-buildsystem:${BRANCH:-6.0}
    container_name: oea-build-dev-${MACHINE:?MACHINE env var must be set (e.g. dm900, vuduo4k)}
    hostname: oea-build-dev-${MACHINE}

    networks:
      - oea-build

    ports:
      # sshd runs unconditionally inside the container; the entrypoint
      # regenerates host keys per container start, so clients get a
      # one-time host-key warning after `compose down/up`. Login as
      # `builder` with password `builder`.
      - "${SSH_PORT:-2222}:22"

    environment:
      MACHINE: "${MACHINE}"
      DISTRO: "${DISTRO:-openatv}"
      DISTRO_TYPE: "${DISTRO_TYPE:-release}"
      SSTATE_MIRROR_URL: "${SSTATE_MIRROR_URL:-}"
      DL_MIRROR_URL: "${DL_MIRROR_URL:-}"
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-truecolor}"

    volumes:
      - "${SSTATE_DIR:-/var/lib/oea-build/sstate/${MACHINE}}:/sstate-cache"
      - "${DEPLOY_DIR:-/var/lib/oea-build/deploy}:/deploy"

    # Entrypoint's final step exec's whatever `$@` it received, so
    # after setup (make update, site.conf, sstate/deploy symlinks)
    # the container idles on `sleep infinity` as PID 1, ready for
    # `docker compose exec`.
    command: ["sleep", "infinity"]

    security_opt:
      - apparmor=unconfined
    sysctls:
      fs.inotify.max_user_watches: 524288

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Long-running dev container: tear it down manually with
    # `compose down`. Don't auto-restart -- if setup crashed you
    # want to see the error, not have it loop.
    restart: "no"

networks:
  oea-build:
    external: true
