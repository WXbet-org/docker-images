# oea-buildsystem -- long-running dev container, NO auto-build.
#
# Same lifecycle as docker-compose.volume.yaml (entrypoint runs setup,
# then idles on `sleep infinity` waiting for you to exec / SSH in),
# but the four storage volumes are bind-mounted from host paths
# instead of Docker-managed named volumes. Lets you `ls
# /var/lib/oea-build/temp/dm900/work/...` from the host or point at
# shared farm filesystem paths.
#
# WARNING -- UID/GID: the container runs as `builder` (uid/gid 1000).
# All four bind-mount targets on the host MUST be owned by 1000 or
# the entrypoint immediately fails with "Permission denied". One-time
# host fix:
#   sudo mkdir -p /var/lib/oea-build/{temp,sstate,sources,deploy}
#   sudo chown -R 1000:1000 /var/lib/oea-build
#
# Usage:
#   MACHINE=dm900 docker compose -f docker-compose.mount.yaml up -d
#   docker compose -f docker-compose.mount.yaml exec oea-build bash
#   ssh -p 2222 builder@localhost    # password: builder
#   docker compose -f docker-compose.mount.yaml down     # when done
#
# Inside the exec'd shell:
#   make MACHINE=dm900 image             # full image build
#   MACHINE=dm900 bitbake enigma2        # single-recipe rebuild
#
# Environment overrides:
#
#   Required:
#     MACHINE=dm900                   single MACHINE (drives deploy symlink)
#
#   Host paths (bind-mount sources):
#     TEMP_DIR=/data/oea/temp         host path for /temp    (default: /var/lib/oea-build/temp)
#     SSTATE_DIR=/data/oea/sstate     host path for /sstate-cache (default: /var/lib/oea-build/sstate)
#     SOURCES_DIR=/data/oea/sources   host path for /sources (default: /var/lib/oea-build/sources)
#     DEPLOY_DIR=/data/oea/deploy     host path for /deploy  (default: /var/lib/oea-build/deploy)
#
#   Build tuning:
#     BRANCH=6.0                      composed image tag (default: 6.0)
#     DISTRO=openatv                  (default: openatv)
#     DISTRO_TYPE=release             (default: release)
#     SSH_PORT=2323                   host port for sshd (default: 2222)
#
#   MinIO integration (optional):
#     SSTATE_MIRROR_URL=...
#     SOURCES_MIRROR_URL=...
#     MINIO_HOST=minio:9000
#     MINIO_ACCESS_KEY=builder
#     MINIO_SECRET_KEY=<secret>

services:
  oea-build:
    image: ghcr.io/wxbet-org/oea-buildsystem:${BRANCH:-6.0}
    container_name: oea-build-dev-${MACHINE:?MACHINE env var must be set (e.g. dm900)}
    hostname: oea-build-dev-${MACHINE}

    networks:
      - oea-build

    ports:
      - "${SSH_PORT:-2222}:22"

    environment:
      MACHINE: "${MACHINE}"
      DISTRO: "${DISTRO:-openatv}"
      DISTRO_TYPE: "${DISTRO_TYPE:-release}"
      BRANCH: "${BRANCH:-6.0}"
      SSTATE_MIRROR_URL: "${SSTATE_MIRROR_URL:-}"
      SOURCES_MIRROR_URL: "${SOURCES_MIRROR_URL:-}"
      MINIO_HOST: "${MINIO_HOST:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-truecolor}"

    volumes:
      - "${TEMP_DIR:-/var/lib/oea-build/temp}:/home/builder/temp"
      - "${SSTATE_DIR:-/var/lib/oea-build/sstate}:/home/builder/sstate-cache"
      - "${SOURCES_DIR:-/var/lib/oea-build/sources}:/home/builder/sources"
      - "${DEPLOY_DIR:-/var/lib/oea-build/deploy}:/home/builder/deploy"

    command: ["sleep", "infinity"]

    security_opt:
      - apparmor=unconfined

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    restart: "no"

networks:
  oea-build:
    external: true
