# oea-buildsystem -- continuous MACHINE loop, N MACHINEs per container.
#
# Same lifecycle as docker-compose.build.volume.yaml (entrypoint loops
# over $MACHINES round-robin forever, mc-mirror to MinIO after each
# MACHINE, state file resumes on restart), but the three storage
# volumes are bind-mounted from host paths instead of Docker-managed
# named volumes. Lets you `ls /var/lib/oea-build/...` from the host or
# point at a shared farm filesystem.
#
# Deploy artefacts live inside TEMP_DIR at builds/.../$M/tmp/deploy/
# -- NOT on a separate bind-mount. Pseudo's openat/fd tracking crashes
# in do_package_write_ipk when tar crosses a symlink onto a second
# volume, so deploy must sit on the same filesystem as tmp/work.
#
# WARNING -- UID/GID: the container runs as `builder` (uid/gid 1000).
# All three bind-mount targets on the host MUST be owned by 1000 or
# the entrypoint immediately fails with "Permission denied". One-time
# host fix:
#   sudo mkdir -p \
#        ${TEMP_DIR:-/var/lib/oea-build/temp} \
#        ${SSTATE_DIR:-/var/lib/oea-build/sstate} \
#        ${SOURCES_DIR:-/var/lib/oea-build/sources}
#   sudo chown -R 1000:1000 /var/lib/oea-build
#
# Usage:
#   MACHINES="dm900 dm920" docker compose -f docker-compose.build.mount.yaml up
#   MACHINES="dm900 dm920" docker compose -f docker-compose.build.mount.yaml up -d
#   docker compose -f docker-compose.build.mount.yaml logs -f
#
# Environment overrides:
#
#   Required:
#     MACHINES="dm900 dm920 ..."      space-separated list of MACHINEs
#
#   Host paths (bind-mount sources):
#     TEMP_DIR=/data/oea/temp         host path for /temp    (default: /var/lib/oea-build/temp)
#     SSTATE_DIR=/data/oea/sstate     host path for /sstate-cache (default: /var/lib/oea-build/sstate)
#     SOURCES_DIR=/data/oea/sources   host path for /sources (default: /var/lib/oea-build/sources)
#
#   Build tuning:
#     BRANCH=6.0                      composed image tag (default: 6.0)
#     DISTRO=openatv                  distro variant  (default: openatv)
#     DISTRO_TYPE=release             (default: release)
#     ACTION=image                    make target     (default: image)
#     SKIP_TO_MACHINE=vuduo4k         force first-cycle start (overrides state file)
#     STACK=a                         host-unique tag for container_name /
#                                     hostname (default: a). Set 'b', 'c', ...
#                                     when running multiple batch stacks on
#                                     the same host so names don't collide.
#     SSH_PORT=2323                   host port for sshd (default: 2222).
#                                     MUST also be unique across stacks on
#                                     the same host -- 2223, 2224, ...
#
#   MinIO integration (all optional):
#     SSTATE_MIRROR_URL=...
#     SOURCES_MIRROR_URL=...
#     MINIO_HOST=minio:9000
#     MINIO_ACCESS_KEY=builder
#     MINIO_SECRET_KEY=<secret>

services:
  oea-build:
    image: ghcr.io/wxbet-org/oea-buildsystem:${BRANCH:-6.0}
    container_name: oea-builder-auto-${STACK:-a}
    hostname: oea-builder-auto-${STACK:-a}

    networks:
      - oea-build

    ports:
      - "${SSH_PORT:-2222}:22"

    environment:
      MACHINES: "${MACHINES:?MACHINES env var must be set, space-separated (e.g. \"dm900 dm920\")}"
      SKIP_TO_MACHINE: "${SKIP_TO_MACHINE:-}"
      DISTRO: "${DISTRO:-openatv}"
      DISTRO_TYPE: "${DISTRO_TYPE:-release}"
      BRANCH: "${BRANCH:-6.0}"
      ACTION: "${ACTION:-image}"
      SSTATE_MIRROR_URL: "${SSTATE_MIRROR_URL:-}"
      SOURCES_MIRROR_URL: "${SOURCES_MIRROR_URL:-}"
      BB_HASHSERVE_URL: "${BB_HASHSERVE_URL:-hashserv:8686}"
      MINIO_HOST: "${MINIO_HOST:-}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-}"
      TERM: "${TERM:-xterm-256color}"
      COLORTERM: "${COLORTERM:-truecolor}"
      TZ: "${TZ:-UTC}"

    volumes:
      # See docker-compose.build.volume.yaml for why `temp` mounts at
      # the openatv release dir instead of /home/builder/temp -- a
      # tmp/ symlink there breaks libtool-native's do_compile.
      # tmp/deploy/ lives inside this same volume as a real dir --
      # pseudo's *at()-fd tracking breaks across a symlink+cross-volume
      # boundary in do_package_write_ipk, so no separate DEPLOY mount.
      - "${TEMP_DIR:-/var/lib/oea-build/temp}:/home/builder/workspace/builds/${DISTRO:-openatv}/${DISTRO_TYPE:-release}"
      - "${SSTATE_DIR:-/var/lib/oea-build/sstate}:/home/builder/sstate-cache"
      - "${SOURCES_DIR:-/var/lib/oea-build/sources}:/home/builder/sources"

    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # Long-running loop: survive host reboots. `docker compose stop`
    # sends SIGTERM -- entrypoint forwards to bitbake, which finishes
    # its in-flight tasks (minutes, not hours) and exits cleanly.
    # State file is not advanced, so next `compose up` resumes AT the
    # same MACHINE (bitbake picks up on task-stamp resume).
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30m    # bitbake shuts down after current tasks finish

networks:
  oea-build:
    external: true
